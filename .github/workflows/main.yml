name: Build Real Voice AI Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --name RealVoiceAI --collect-all PySide6 --collect-all shiboken6 app/main.py

      - name: Build installer
        shell: cmd
        run: |
          if not exist installer-output mkdir installer-output
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer\RealVoiceAI.iss

      - uses: actions/upload-artifact@v4
        with:
          name: RealVoiceAI-Setup-v5.4
          path: installer-output/RealVoiceAI-Setup-v6.0.exe
          if-no-files-found: error
