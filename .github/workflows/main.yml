name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --name AIVoiceChangerRTX --collect-all PySide6 --collect-all shiboken6 --collect-all PySide6.QtWebEngineCore --collect-all PySide6.QtWebEngineWidgets app/main.py

      - name: Build installer
        shell: cmd
        run: |
          if not exist release mkdir release
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer\AIVoiceChangerRTX.iss

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Voice-Changer-RTX-Setup-v4
          path: release/AI-Voice-Changer-RTX-Setup-v4.exe
